# Static SPA server inside the icds-web container. Public routing/TLS live in the hosting repo.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Account API on the private icds-internal network; resolved per request so nginx starts without it.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $icds_api http://icds-api:4000;
        proxy_pass $icds_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host keeps any port so the API's Origin check matches what the browser sent.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
        proxy_buffering off;
        client_max_body_size 10m;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Content-hashed bundles and fonts never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Service worker files must be revalidated so updates reach installed apps.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[\w-]+\.js|version\.txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
