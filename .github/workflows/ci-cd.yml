name: CI/CD

# Only master: verify, then deploy to production (upstream repository only).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: icds-ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (app and server)
        run: npx tsc -b

      - name: Unit, API and report-generation tests
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          # Preinstalled on GitHub's Ubuntu runners; used by Puppeteer for the PDF tests.
          CHROME_PATH: /usr/bin/google-chrome
        run: npm test

      - name: Build
        run: npm run build

      - name: Shell syntax
        run: bash -n scripts/deploy.sh scripts/ci-deploy.sh scripts/backup-mongo.sh

      - name: Container stack smoke test
        run: |
          set -euo pipefail
          docker network create web
          sed "s/^MONGO_ROOT_PASSWORD=.*/MONGO_ROOT_PASSWORD=$(openssl rand -hex 24)/; s/^COOKIE_SECURE=.*/COOKIE_SECURE=false/" .env.example > .env
          GIT_SHA="${GITHUB_SHA::12}" docker compose build
          docker compose up -d
          for c in icds-mongo icds-api icds-web; do
            for _ in $(seq 1 45); do
              [ "$(docker inspect --format '{{.State.Health.Status}}' "$c")" = healthy ] && break
              sleep 2
            done
            docker inspect --format "$c {{.State.Health.Status}}" "$c"
          done
          curl_web() { docker run --rm --network web curlimages/curl:8.10.1 -fsS "$@"; }
          curl_web http://icds-web:8080/healthz
          curl_web http://icds-web:8080/ | grep -q '<div id="root">'
          curl_web -I http://icds-web:8080/ | grep -qi 'content-security-policy'
          curl_web http://icds-web:8080/api/health | grep -q '"ok":true'
          # Register, generate a month of reports with Puppeteer inside icds-api, and download the PDF.
          docker run --rm --network web --entrypoint sh curlimages/curl:8.10.1 -ec '
            api=http://icds-web:8080/api; j=/tmp/cookies
            curl -fsS -c $j -H "Content-Type: application/json" \
              -d "{\"login\":\"ci@example.com\",\"password\":\"ci-password\",\"name\":\"CI\",\"center\":{\"name\":\"CI Centre\",\"number\":\"1\"}}" \
              $api/auth/register | grep -q "\"login\":\"ci@example.com\""
            id=$(curl -fsS -b $j -H "Content-Type: application/json" -d "{\"from\":\"2026-10-01\",\"to\":\"2026-10-31\",\"paper\":\"A4\"}" \
              $api/reports | sed -n "s/.*\"id\":\"\([a-f0-9]*\)\".*/\1/p")
            test -n "$id"
            curl -fsS -b $j -o /tmp/r.pdf $api/reports/$id/files/pdf && head -c 5 /tmp/r.pdf | grep -q "%PDF-"
            curl -fsS -b $j -o /tmp/r.xlsx $api/reports/$id/files/xlsx && head -c 2 /tmp/r.xlsx | grep -q "PK"
          '
          docker compose down -v

  deploy:
    name: Deploy to VPS
    needs: verify
    # Forks run the verify job only; production deploys come from the upstream repository.
    if: github.repository == 'dasabhishekdev/icds-report-generator' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://icds.educoreva.com
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_PASSPHRASE: ${{ secrets.PROD_SSH_PASSPHRASE }}
      # Deliberately not PROD_APP_DIR: deploy rsyncs with --delete, so it must never inherit another app's path.
      ICDS_APP_DIR: ${{ secrets.ICDS_APP_DIR }}
      PROD_SSH_KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload and deploy on VPS
        run: bash scripts/ci-deploy.sh

      - name: Public health check
        continue-on-error: true
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://icds.educoreva.com/healthz
          curl -fsS --retry 5 --retry-delay 5 https://icds.educoreva.com/api/health
