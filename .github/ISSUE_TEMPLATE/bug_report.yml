name: Bug report
description: Something is calculated wrong, a register looks wrong, or the app misbehaves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include real beneficiary names, dates of birth or phone numbers. Blur them in screenshots.
        Security problems go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Attendance / calculations
        - Fuel & Spices register
        - Nutrition Voucher register
        - SNP Veg & Egg register
        - Stock & Consumption register
        - Jan Andolan photos / Poshan portal
        - Holidays
        - Login / account
        - Android app
        - Other
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Month, paper size and format
      placeholder: "e.g. September 2026, A4, PDF"
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. Android 14, Chrome / Android app 1.0.1"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
